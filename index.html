<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIFARE Classic Dump Parser — decode .mfd keys &amp; access bits</title>
  <meta name="description" content="Drop a MIFARE Classic dump (.mfd, .bin, .eml, .mct, Flipper .nfc) and get a colour-coded breakdown of keys, access bits, value blocks and MAD. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='7' width='26' height='18' rx='3' fill='%230d1117' stroke='%23ffd700' stroke-width='2'/><rect x='7' y='12' width='7' height='6' rx='1' fill='%235fd75f'/><rect x='17' y='12' width='8' height='2' fill='%2300d7ff'/><rect x='17' y='16' width='5' height='2' fill='%23ff87ff'/></svg>">
  <link rel="stylesheet" href="assets/style.css?v=4fd00720">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▣</span>
      <div>
        <h1>MIFARE Classic Dump Parser</h1>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="parser" role="tab">Dump parser</button>
      <button class="tab" data-tab="compare" role="tab">Compare dumps</button>
      <a class="tab ghost" href="https://github.com/" id="repo-link" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </header>

  <main>
    <!-- ════════════════ PARSER TAB ════════════════ -->
    <section id="tab-parser" class="tabpane active">
      <div id="dropzone" class="dropzone" tabindex="0">
        <input type="file" id="file" hidden>
        <div class="dz-inner">
          <div class="dz-icon">⇪</div>
          <div class="dz-title">Drop a dump here or <u>browse</u></div>
          <div class="dz-sub">.mfd · .bin · .eml · .mct · .nfc — parsed locally, nothing is uploaded</div>
        </div>
      </div>
      <div class="dz-actions"><button id="load-sample" class="linkbtn">or try a sample dump</button></div>

      <div id="error" class="error" hidden></div>
      <div id="report" hidden></div>
    </section>

    <!-- ════════════════ COMPARE TAB ════════════════ -->
    <section id="tab-compare" class="tabpane">
      <div class="cmp-drops">
        <div class="dropzone cmp-drop" id="drop-A" tabindex="0" data-slot="A">
          <input type="file" hidden>
          <div class="dz-inner">
            <div class="slot-label">A</div>
            <div class="dz-title">Drop dump A or <u>browse</u></div>
            <div class="dz-file mono" id="file-A">no file</div>
          </div>
        </div>
        <button class="btn swap" id="cmp-swap" title="Swap A and B">⇄</button>
        <div class="dropzone cmp-drop" id="drop-B" tabindex="0" data-slot="B">
          <input type="file" hidden>
          <div class="dz-inner">
            <div class="slot-label">B</div>
            <div class="dz-title">Drop dump B or <u>browse</u></div>
            <div class="dz-file mono" id="file-B">no file</div>
          </div>
        </div>
      </div>
      <div class="dz-actions"><label class="opt"><input type="checkbox" id="cmp-only" checked> Only changed sectors</label></div>
      <div id="cmp-error" class="error" hidden></div>
      <div id="cmp-report" hidden></div>
    </section>
  </main>

  <footer><span>MIT · <a href="https://github.com/YoussefHawash/mfid-veiwer">source</a></span><span>For cards you own or are authorised to test.</span></footer>

  <script src="assets/mifare.js?v=4fd00720"></script>
  <script src="assets/app.js?v=4fd00720"></script>
</body>
</html>
